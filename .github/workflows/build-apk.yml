name: Build Android APK (No Expo Cloud)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Prepare Offline Assets
        run: npm run prepare:assets

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK with Native Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyPath-Standalone-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
